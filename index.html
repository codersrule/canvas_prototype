<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduVerse - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="js/spa.js"></script>
</head>
<body class="bg-gray-50">
<!-- Navbar -->
<nav class="fixed w-full bg-blue-600 text-white z-50 px-4 h-16 flex items-center justify-between shadow-md" role="navigation" aria-label="Main navigation">
    <div class="flex items-center space-x-4">
        <button
                id="sidebar-toggle"
                class="md:hidden focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-blue-600 rounded p-2"
                aria-label="Toggle sidebar"
                aria-expanded="false"
                aria-controls="sidebar">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
        <a href="#" class="flex items-center hover:opacity-90 transition-opacity">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mr-2" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
            <span class="text-xl font-bold hidden sm:inline">EduVerse</span>
        </a>
    </div>

    <div class="flex items-center space-x-4">
        <button
                id="notification-btn"
                class="relative p-2 rounded-full hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-white transition-colors"
                aria-label="Notifications">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
            <span id="notification-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-semibold hidden">3</span>
        </button>

        <div class="flex items-center space-x-2 cursor-pointer hover:opacity-90 transition-opacity" role="button" tabindex="0" aria-label="User menu">
            <div class="w-8 h-8 bg-yellow-400 rounded-full flex items-center justify-center text-blue-600 font-bold text-sm">SH</div>
            <span class="hidden md:inline font-medium">Sadiq Haruna</span>
        </div>
    </div>
</nav>

<!-- Sidebar Backdrop (Mobile) -->
<div
        id="sidebar-backdrop"
        class="sidebar-backdrop fixed inset-0 bg-black bg-opacity-50 z-40 opacity-0 pointer-events-none md:hidden"
        aria-hidden="true"></div>

<!-- Sidebar -->
<aside
        id="sidebar"
        class="sidebar-transition fixed top-16 left-0 h-[calc(100vh-4rem)] bg-blue-700 text-white w-64 z-40 overflow-y-auto custom-scrollbar transform -translate-x-full md:translate-x-0"
        role="complementary"
        aria-label="Sidebar navigation">
    <nav class="p-4 space-y-1" aria-label="Sidebar">
        <a href="#" class="nav-link active flex items-center space-x-3 px-4 py-3 rounded-lg" data-page="dashboard" aria-current="page">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            <span>Dashboard</span>
        </a>

        <a href="#" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-lg" data-page="courses">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
            <span>Courses</span>
        </a>

        <a href="#" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-lg" data-page="calendar">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <span>Calendar</span>
        </a>

        <a href="#" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-lg" data-page="inbox">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
            <span>Inbox</span>
        </a>

        <a href="#" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-lg" data-page="grades">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
            </svg>
            <span>Grades</span>
        </a>

        <a href="#" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-lg" data-page="groups">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            <span>Groups</span>
        </a>

        <a href="#" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-lg" data-page="settings">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span>Settings</span>
        </a>
    </nav>
</aside>

<!-- Main Content -->
<main id="main-content" class="main-transition ml-0 md:ml-64 pt-16 min-h-screen">
    <div class="p-6">
        <!-- Welcome Banner -->
        <div class="bg-gradient-to-r from-blue-600 to-blue-500 text-white rounded-xl p-6 mb-6 shadow-md">
            <h1 class="text-2xl md:text-3xl font-bold mb-2">Welcome back, Peter Anteater! 🐜</h1>
            <p class="text-blue-100">You have 5 assignments due this week</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Left Column - Courses -->
            <div class="lg:col-span-2">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">My Courses - Fall 2025</h2>
                <div id="courses-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Courses will be rendered here -->
                </div>
            </div>

            <!-- Right Column - Widgets -->
            <div class="space-y-6">
                <!-- To-Do Widget -->
                <div class="bg-white rounded-lg shadow-md p-6">
                    <div class="flex items-center mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="text-blue-500 mr-2 w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                        </svg>
                        <h3 class="text-lg font-semibold text-gray-700">To Do</h3>
                    </div>
                    <div id="todos-container" class="space-y-4">
                        <!-- Todos will be rendered here -->
                    </div>
                    <a href="#" class="block text-center text-blue-500 text-sm mt-4 hover:underline">View All</a>
                </div>

                <!-- Announcements Widget -->
                <div class="bg-white rounded-lg shadow-md p-6">
                    <div class="flex items-center mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="text-blue-500 mr-2 w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z" />
                        </svg>
                        <h3 class="text-lg font-semibold text-gray-700">Recent Announcements</h3>
                    </div>
                    <div id="announcements-container" class="space-y-4">
                        <!-- Announcements will be rendered here -->
                    </div>
                    <a href="#" class="block text-center text-blue-500 text-sm mt-4 hover:underline">View All</a>
                </div>

                <!-- Calendar Widget -->
                <div class="bg-white rounded-lg shadow-md p-6">
                    <div class="flex items-center mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="text-blue-500 mr-2 w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <h3 class="text-lg font-semibold text-gray-700">November 2025</h3>
                    </div>
                    <div class="grid grid-cols-7 gap-1 text-center text-sm">
                        <div class="font-semibold text-gray-500 py-2">S</div>
                        <div class="font-semibold text-gray-500 py-2">M</div>
                        <div class="font-semibold text-gray-500 py-2">T</div>
                        <div class="font-semibold text-gray-500 py-2">W</div>
                        <div class="font-semibold text-gray-500 py-2">T</div>
                        <div class="font-semibold text-gray-500 py-2">F</div>
                        <div class="font-semibold text-gray-500 py-2">S</div>

                        <div class="py-2"></div>
                        <div class="py-2"></div>
                        <div class="py-2"></div>
                        <div class="py-2"></div>
                        <div class="py-2"></div>
                        <div class="py-2"></div>
                        <div class="py-2">1</div>

                        <div class="py-2 bg-blue-500 text-white rounded-full">2</div>
                        <div class="py-2">3</div>
                        <div class="py-2">4</div>
                        <div class="py-2 bg-yellow-100 rounded-full">5</div>
                        <div class="py-2 bg-yellow-100 rounded-full">6</div>
                        <div class="py-2">7</div>
                        <div class="py-2 bg-yellow-100 rounded-full">8</div>

                        <div class="py-2">9</div>
                        <div class="py-2">10</div>
                        <div class="py-2">11</div>
                        <div class="py-2">12</div>
                        <div class="py-2">13</div>
                        <div class="py-2">14</div>
                        <div class="py-2">15</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
